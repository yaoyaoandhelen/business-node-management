name: Product prototype reviews
run-name: Product review ${{ inputs.request_id || github.sha }}
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      review_id:
        description: Existing immutable review ID; do not rebuild its baseline
        required: false
        type: string
      request_id:
        description: Publication attempt identity
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: product-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the project-locked workflow toolbox
        run: node tooling/restore.mjs
      - name: Install locked toolbox dependencies
        run: npm ci --prefix .local/workflow-kit
      - name: Check explicit project configuration
        run: node .local/workflow-kit/bin/pwf.mjs project check --project project.config.yaml
      - name: Assemble all immutable reviews
        run: node .local/workflow-kit/bin/pwf.mjs review export --project project.config.yaml --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy full review history
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the actual current and historical review content
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          REVIEW_ID: ${{ inputs.review_id }}
        run: node .local/workflow-kit/adapters/github-pages/verify-deployment.mjs --project project.config.yaml --url "$DEPLOYMENT_URL" --review "$REVIEW_ID"
