schemaVersion: 1
projectId: business-node-management
name: 业务节点管理系统
projectType: business
pages:
  - id: portal-home
    name: 业务节点门户首页
    path: ./portal-standalone.html?user=enterprise
  - id: portal-workbench
    name: 门户工作台与身份续期
    path: ./portal-standalone.html?user=enterprise&view=workbench
  - id: portal-login
    name: 门户登录与到期提醒
    path: ./portal-standalone.html?view=login
  - id: home
    name: 首页与接入登记
    path: ./index.html?system=management
  - id: risk
    name: 敏感词审核不通过
    path: ./index.html?view=risk
  - id: loading
    name: 敏感词审核中
    path: ./index.html?view=loading
  - id: catalog
    name: 数据目录与查询安全
    path: ./index.html?view=catalog
  - id: audit
    name: 查询日志与风险分析
    path: ./index.html?view=audit
  - id: portal-person-home
    name: 个人用户门户首页
    path: ./portal-standalone.html?user=personal
  - id: portal-person-workbench
    name: 个人身份管理与续期
    path: ./portal-standalone.html?user=personal&view=workbench
  - id: portal-auth-entry
    name: 主体身份待认证
    path: ./portal-standalone.html?user=authentication&view=auth-entry
  - id: portal-auth-types
    name: 选择认证类型
    path: ./portal-standalone.html?user=authentication&view=auth-types
  - id: portal-auth-personal
    name: 个人认证审核中
    path: ./portal-standalone.html?user=authentication&view=auth-personal
  - id: portal-auth-enterprise
    name: 企业认证审核中
    path: ./portal-standalone.html?user=authentication&view=auth-enterprise
  - id: portal-frozen-home
    name: 冻结身份与解冻申诉
    path: ./portal-standalone.html?user=frozen&view=home
build:
  adapter: vite
  root: prototype
  config: prototype/vite.config.mjs
  output: prototype/dist
  sourcePaths:
    - prototype
    - data/requirements
    - project.config.yaml
github:
  owner: yaoyaoandhelen
  repository: business-node-management
  branch: main
  basePath: /business-node-management/
  url: https://yaoyaoandhelen.github.io/business-node-management/
zentao:
  provider: mcp
  baseUrl: null
  productId: null
  projectId: null
  executionId: null
  receiver: null
  mcp:
    url: null
    headersEnv: {}
    tools: {}
