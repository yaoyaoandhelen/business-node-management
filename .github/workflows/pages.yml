name: Product prototype reviews
run-name: Product review ${{ inputs.request_id || github.sha }}
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      review_id:
        description: Existing immutable review ID
        required: false
        type: string
      request_id:
        description: Publication attempt identity
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: product-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble saved reviews
        env:
          REVIEW_ID: ${{ inputs.review_id }}
        run: |
          node --input-type=module <<'JS'
          import {cp, mkdir, readdir, readFile, writeFile, access} from 'node:fs/promises';
          const ids=(await readdir('site-archive/review')).filter(id=>/^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$/.test(id)).sort();
          const dated=await Promise.all(ids.map(async id=>({id,createdAt:JSON.parse(await readFile('site-archive/review/'+id+'/manifest.json','utf8')).createdAt})));
          const id=process.env.REVIEW_ID||dated.sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).at(-1)?.id;
          if(!id||!ids.includes(id))throw Error('No saved review matches the requested ID');
          await access('site-archive/review/'+id+'/manifest.json');
          await mkdir('_site',{recursive:true});
          await cp('site-archive/review','_site/review',{recursive:true});
          await writeFile('_site/index.html','<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./review/'+id+'/"><a href="./review/'+id+'/">打开原型与需求</a>');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy saved review history
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed review files
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import {readdir, readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const digest=data=>createHash('sha256').update(data).digest('hex');
          for(const id of await readdir('_site/review')){
            for(const file of ['manifest.json','snapshot.json','index.html']){
              const response=await fetch(new URL('review/'+id+'/'+file,process.env.DEPLOYMENT_URL),{signal:AbortSignal.timeout(20000)});
              if(!response.ok||digest(Buffer.from(await response.arrayBuffer()))!==digest(await readFile('_site/review/'+id+'/'+file)))throw Error('Deployed review differs: '+id+'/'+file);
            }
          }
          JS
